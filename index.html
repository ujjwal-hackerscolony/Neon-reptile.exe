<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>Neon Reptile Cursor</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #03070d;
  color: #00ffc8;
  font-family: monospace;
  overflow: hidden;
  height: 100dvh;
}

header {
  height: 76px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-bottom: 1px solid #00ffc833;
  background: #06111b;
}

h2 {
  font-size: 20px;
  text-shadow: 0 0 12px #00ffb3;
}

header p {
  font-size: 10px;
  color: #48a9c6;
  letter-spacing: 2px;
}

main {
  height: calc(100dvh - 76px);
  position: relative;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.hint {
  position: absolute;
  bottom: 22px;
  width: 100%;
  text-align: center;
  font-size: 11px;
  color: #3b9c9b;
  pointer-events: none;
}
</style>
</head>

<body>

<header>
  <h2>NEON REPTILE.exe</h2>
  <p>TOUCH • MOVE • CONTROL</p>
</header>

<main>
  <canvas id="screen"></canvas>
  <div class="hint">MOVE YOUR FINGER TO CONTROL THE REPTILE</div>
</main>

<script>
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

let W, H, DPR;
let target = { x: 180, y: 240 };
let nodes = [];
let time = 0;

const COUNT = 52;
const SPACING = 5.5;

function resize() {
  const rect = canvas.getBoundingClientRect();

  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = rect.width;
  H = rect.height;

  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  target.x = W * 0.55;
  target.y = H * 0.48;

  nodes = [];

  for (let i = 0; i < COUNT; i++) {
    nodes.push({
      x: target.x - i * SPACING,
      y: target.y
    });
  }
}

function move(e) {
  const r = canvas.getBoundingClientRect();
  target.x = e.clientX - r.left;
  target.y = e.clientY - r.top;
}

canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  move(e);
});

canvas.addEventListener("pointermove", move);
window.addEventListener("resize", resize);

function line(x1, y1, x2, y2, width = 1) {
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function glowLine(x1, y1, x2, y2, color, width = 1) {
  ctx.strokeStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 9;
  line(x1, y1, x2, y2, width);
  ctx.shadowBlur = 0;
}

function joint(x, y, radius, color) {
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function limb(index, side, angle, color) {
  const p = nodes[index];

  const direction = Math.atan2(
    nodes[index + 1].y - nodes[index - 1].y,
    nodes[index + 1].x - nodes[index - 1].x
  );

  const baseAngle = direction + side * 1.0;
  const len1 = 20;
  const len2 = 17;

  const a = baseAngle + side * 0.45;

  const x1 = p.x + Math.cos(a) * len1;
  const y1 = p.y + Math.sin(a) * len1;

  const x2 = x1 + Math.cos(a + angle * side) * len2;
  const y2 = y1 + Math.sin(a + angle * side) * len2;

  glowLine(p.x, p.y, x1, y1, color, 1.3);
  glowLine(x1, y1, x2, y2, color, 1.1);
  joint(x1, y1, 1.8, color);

  // Three little toes
  for (let k = -1; k <= 1; k++) {
    const toeAngle = a + angle * side + k * 0.65;
    glowLine(
      x2, y2,
      x2 + Math.cos(toeAngle) * 6,
      y2 + Math.sin(toeAngle) * 6,
      color, 0.9
    );
  }
}

function drawHead() {
  const p = nodes[0];
  const q = nodes[2];

  const angle = Math.atan2(p.y - q.y, p.x - q.x);
  const size = 1;

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(angle);

  // Head outline
  ctx.strokeStyle = "#00ffb3";
  ctx.shadowColor = "#00ffb3";
  ctx.shadowBlur = 12;
  ctx.lineWidth = 1.6;

  ctx.beginPath();
  ctx.moveTo(-7, -7);
  ctx.lineTo(3, -9);
  ctx.lineTo(13, -5);
  ctx.lineTo(19, 0);
  ctx.lineTo(13, 5);
  ctx.lineTo(3, 9);
  ctx.lineTo(-7, 7);
  ctx.closePath();
  ctx.stroke();

  // Eyes
  for (const side of [-1, 1]) {
    ctx.fillStyle = "#b8ff00";
    ctx.beginPath();
    ctx.arc(5, side * 5, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Snout detail
  ctx.strokeStyle = "#00eaff";
  ctx.beginPath();
  ctx.moveTo(9, 0);
  ctx.lineTo(16, 0);
  ctx.stroke();

  ctx.restore();
  ctx.shadowBlur = 0;
}

function drawReptile() {
  // Body follows the head
  nodes[0].x += (target.x - nodes[0].x) * 0.28;
  nodes[0].y += (target.y - nodes[0].y) * 0.28;

  for (let i = 1; i < COUNT; i++) {
    const a = nodes[i - 1];
    const b = nodes[i];

    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;

    b.x = a.x + dx / d * SPACING;
    b.y = a.y + dy / d * SPACING;
  }

  // Main spine
  for (let i = 0; i < COUNT - 1; i++) {
    const a = nodes[i];
    const b = nodes[i + 1];
    const fade = 1 - i / COUNT;

    glowLine(
      a.x, a.y, b.x, b.y,
      i < 23
        ? `rgba(0,255,179,${0.45 + fade * 0.55})`
        : `rgba(0,225,255,${0.35 + fade * 0.55})`,
      Math.max(0.55, 1.5 * fade)
    );
  }

  // Ribs
  for (let i = 4; i < 35; i++) {
    const p = nodes[i];
    const before = nodes[i - 1];
    const after = nodes[i + 1];

    const angle = Math.atan2(
      after.y - before.y,
      after.x - before.x
    );

    const width = 11 * (1 - i / 43);

    for (const side of [-1, 1]) {
      const a = angle + side * 1.25;
      const x = p.x + Math.cos(a) * width;
      const y = p.y + Math.sin(a) * width;

      glowLine(
        p.x, p.y, x, y,
        side === 1 ? "#00d9ff" : "#00ffae",
        0.8
      );
    }

    if (i % 3 === 0) {
      joint(p.x, p.y, 1, "#70ffe5");
    }
  }

  // Four legs
  for (const index of [9, 16, 23, 29]) {
    const phase = Math.sin(time * 0.07 + index);
    limb(index, -1, phase * 0.35, "#00ffb3");
    limb(index, 1, phase * 0.35, "#00d9ff");
  }

  // Long, narrowing tail
  for (let i = 34; i < COUNT - 2; i += 2) {
    const p = nodes[i];
    const next = nodes[i + 1];

    joint(p.x, p.y, Math.max(0.6, 2.0 - i / 35), "#00eaff");

    glowLine(
      p.x, p.y, next.x, next.y,
      "#00eaff", Math.max(0.5, 1.5 - i / 45)
    );
  }

  drawHead();
}

function animate() {
  time++;

  ctx.clearRect(0, 0, W, H);

  // Subtle futuristic grid
  ctx.strokeStyle = "rgba(0,200,190,0.055)";
  ctx.lineWidth = 1;

  for (let x = 0; x < W; x += 30) {
    line(x, 0, x, H);
  }

  for (let y = 0; y < H; y += 30) {
    line(0, y, W, y);
  }

  drawReptile();

  requestAnimationFrame(animate);
}

resize();
animate();
</script>

</body>
</html>
